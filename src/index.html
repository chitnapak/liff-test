<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <div id="lineprofile" style="display: none;">
    <img width="100px" id="profileImage" src="" />
    <div>
      Hello <b><span id="profileName">Name</span></b>
    </div>
    <div>UID <span id="profileUID">UID</span></div>

    <div class="message">
      <div>Send message</div>
      <input id="message" />
      <button onclick="sendMessage()">Send</button>
    </div>
    <button onclick="logOut()">Logout</button>
  </div>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.1/axios.min.js"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  ></script>
  <script>
    let userId = "";

    const main = async () => {
      await liff.init({ liffId: "2000719050-rGVOBePm" });
      if (liff.isLoggedIn()) {
        const profile = await liff.getProfile();

        // update profile
        profileImage.src = profile.pictureUrl;
        profileName.innerText = profile.displayName;
        profileUID.innerText = profile.userId;

        // collect userId
        userId = profile.userId;

        // show profile
        lineprofile.style.display = "block";
      } else {
        liff.login();
      }
    };

    // เพิิ่ม sendMessage มายิงไปยังฝั่ง Backend
    const sendMessage = async () => {
      try {
        if (!message.value) {
          alert("message not found");
          return false;
        }

        const data = {
          userUid: userId,
          message: message.value,
        };
        console.log("data", data);
        const BACKEND_URL = "https://untamed-washhouse-caring.ngrok-free.dev/send-message"; // ⚠️ เปลี่ยน xxxx เป็น subdomain จริงของ ngrok ของคุณ
        const response = await axios.post(`${BACKEND_URL}/send-message`, data);
        console.log("response", response.data);
      } catch (error) {
        console.log("error", error.message);
      }
    };
    main();
  </script>
</body>
</html>
